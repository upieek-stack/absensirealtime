    function renderAttendanceSessionPanel(){const selected=state.attendanceSessions.find(s=>s.id===state.selectedAttendanceSessionId);const sessionCards=state.attendanceSessions.slice().reverse().map(s=>{const counts=attendanceCounts(s.attendance),done=Object.values(s.attendance).filter(Boolean).length;return `<button class="session-card" style="text-align:left" data-attendance-select="${s.id}"><div class="split"><span class="badge">${esc(s.className)}</span>${iconBadge(s.status)}</div><h3 style="margin-top:9px">${esc(s.subject)}</h3><p>${esc(s.teacherCode)} · ${esc(s.teacher)} · ${new Date(s.startedAt).toLocaleString("id-ID")}</p><p>${done}/${s.roster.length} siswa diabsen</p><p class="subtext">Hadir ${counts.Hadir} · Sakit ${counts.Sakit} · Izin ${counts.Izin} · Alpa ${counts.Alpa}</p></button>`}).join("");let roster="";if(selected){const counts=attendanceCounts(selected.attendance);roster=`<section class="panel" style="margin-top:12px"><div class="panel-head"><div><h3>Absensi ${esc(selected.className)} · ${esc(selected.subject)}</h3><div class="subtext">Kode sesi ${esc(selected.sessionCode)} · Guru ${esc(selected.teacherCode)}: ${esc(selected.teacher)} · Dimulai ${new Date(selected.startedAt).toLocaleString("id-ID")} · Durasi tidak dibatasi jadwal.</div></div><div class="btn-row">${selected.status==="Berlangsung"?`<button class="small-btn" data-export="class-attendance">Ekspor Daftar Hadir CSV</button><button class="small-btn success" data-attendance-finish="${selected.id}">Selesaikan Absensi</button>`:`<button class="small-btn" data-export="class-attendance">Ekspor Daftar Hadir CSV</button>${iconBadge(selected.status)}`}</div></div><div class="panel-body"><div class="stat-mini"><span><b>${selected.roster.length}</b>Jumlah siswa di rombel</span><span><b>${counts.Hadir}</b>Hadir</span><span><b>${counts.Sakit}</b>Sakit</span><span><b>${counts.Izin}</b>Izin</span><span><b>${counts.Alpa}</b>Alpa</span><span><b>${selected.roster.length-Object.values(selected.attendance).filter(Boolean).length}</b>Belum diabsen</span></div>${selected.status==="Berlangsung"?`<p class="subtext" style="margin:12px 0">Pilih satu status untuk setiap siswa. Absensi bisa dimulai kapan saja; waktu mulai tercatat otomatis.</p>`:`<div class="notice" style="margin-top:12px">Sesi ini sudah selesai. Riwayat absensi tetap dapat dilihat.</div>`}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>No.</th><th>Nama siswa</th><th>Kelas</th><th>Status kehadiran</th><th>Waktu dicatat</th></tr></thead><tbody>${selected.roster.map((studentId,index)=>{const student=state.students.find(x=>x.id===studentId);const status=selected.attendance[studentId]||"";return `<tr><td>${index+1}</td><td><div class="person">${esc(student?.name||studentId)}</div><div class="subtext">${studentId}</div></td><td>${esc(selected.className)}</td><td>${selected.status==="Berlangsung"?`<select class="filter-select" data-session-attendance="${selected.id}" data-student-attendance="${studentId}"><option value="">Belum diabsen</option>${["Hadir","Sakit","Izin","Alpa"].map(x=>`<option ${status===x?"selected":""}>${x}</option>`).join("")}</select>`:iconBadge(status||"Belum diabsen")}</td><td>${selected.attendanceTimes?.[studentId]||"—"}</td></tr>`}).join("")}</tbody></table></div></section>`}
      return `<section class="panel"><div class="panel-head"><div><h3>Absensi Siswa per Pertemuan</h3><div class="subtext">Buat sesi kapan pun saat guru masuk kelas. Daftar dan kapasitas rombel mengikuti data siswa.</div></div><button class="primary" data-action="start-attendance-session">＋ Mulai Absensi Kelas</button></div><div class="panel-body"><div class="stat-mini">${classNames.map((name,i)=>`<span><b>${studentsPerClass(i)}</b>${name}</span>`).join("")}</div>${state.attendanceSessions.length?`<h4 style="font-size:10px;margin:16px 0 8px">Riwayat dan sesi absensi</h4><div class="grid session-grid">${sessionCards}</div>`:`<div class="empty">Belum ada sesi absensi. Pilih “Mulai Absensi Kelas” ketika guru memasuki kelas; sesi dapat dibuat kapan saja.</div>`}</div></section>${roster}`}
    function renderKbm(){return `${pageHeader("Monitoring KBM, Jadwal & Jurnal","Pantau absensi per pertemuan, presensi siswa, status pengampu, dan jurnal digital.")}<div class="toolbar"><span class="badge green">${state.sessions.length} ROMBEL · ${state.attendanceSessions.length} SESI ABSENSI</span><button class="small-btn" data-action="new-journal">＋ Isi Jurnal KBM</button></div>${renderAttendanceSessionPanel()}<h2 style="font-size:14px;margin:18px 0 10px">Status Jurnal dan Monitoring Pembelajaran</h2><div class="grid session-grid">${state.sessions.filter(s=>state.classFilter==="Semua Kelas"||s.className===state.classFilter).map(s=>`<article class="session-card"><div class="split"><span class="badge">${s.className}</span>${iconBadge(s.journal)}</div><h3 style="margin-top:10px">${s.subject}</h3><p>${s.teacher}</p><p>${s.time} · ${s.present} dari ${studentsPerClass(classNames.indexOf(s.className))} siswa tercatat</p><p>Pengampu: ${iconBadge(s.teacherStatus)}</p><p>Revisi jurnal: <b>${s.revision}</b></p><button class="small-btn" style="margin-top:8px" data-edit-journal="${s.id}">${s.journal==="Belum Diisi"?"Isi Jurnal":"Buka / Revisi Jurnal"}</button></article>`).join("")}</div>`}
    function renderDuty(){const canSee= ["kepala_sekolah","wakil_kepala_sekolah","guru_piket"].includes(state.currentRole);return `${pageHeader("Buku Piket Digital","Catat kejadian harian dengan perlindungan rincian insiden sensitif.")}<div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Tambah Catatan Piket</h3></div><div class="panel-body"><form id="dutyForm"><div class="field"><label>Judul kejadian</label><input name="title" required maxlength="120" placeholder="Ringkasan kejadian"></div><div class="field"><label>Rincian / tindak lanjut</label><textarea name="detail" rows="3" required placeholder="Catat tindakan yang dilakukan"></textarea></div><label style="font-size:10px;display:flex;gap:7px;align-items:center;margin-bottom:12px"><input type="checkbox" name="sensitive"> Tandai Insiden Sensitif (Privat)</label><button class="primary">Simpan Catatan Piket</button></form></div></section><section class="panel"><div class="panel-head"><h3>Kejadian Hari Ini</h3><span class="badge">${state.duties.length} CATATAN</span></div><div class="panel-body">${state.duties.map(d=>`<div class="activity"><div><div class="activity-text">${esc(d.title)} ${d.sensitive?'<span class="badge red">PRIVAT</span>':""}</div><div class="activity-time">${d.time} · ${esc(d.by)}</div><div class="warning-desc ${d.sensitive&&!canSee?"sensitive":""}" style="margin-top:6px">${canSee||!d.sensitive?esc(d.detail):"Rincian insiden sensitif disamarkan untuk melindungi privasi."}</div></div></div>`).join("")}</div></section></div>`}
    function renderComplaints(){const statuses=["Baru","Diverifikasi","Ditugaskan","Dalam proses","Menunggu informasi","Selesai","Ditolak dengan alasan","Dibuka kembali"];return `${pageHeader("Pengaduan & Tindak Lanjut","Kelola tiket dengan tenggat SLA dan timeline tindak lanjut yang tersimpan.")}<div class="grid two-col"><section class="panel"><div class="panel-head"><h3>Buat Pengaduan</h3></div><div class="panel-body"><form id="complaintForm"><div class="field"><label>Judul</label><input name="title" required maxlength="140"></div><div class="field"><label>Kategori</label><select name="category"><option>Sarana</option><option>Kesiswaan</option><option>Kurikulum</option><option>Humas</option></select></div><div class="field"><label>Target tindak lanjut</label><select name="owner"><option>Tim Sarpras</option><option>BK</option><option>Kurikulum</option><option>Kesiswaan</option></select></div><button class="primary">Buat Tiket</button></form></div></section><div class="grid" style="align-content:start">${state.complaints.map(c=>{const overdue=new Date(c.sla)<Date.now()&&!["Selesai","Ditolak dengan alasan"].includes(c.status);return `<article class="panel"><div class="panel-body"><div class="split"><div><div class="person">${esc(c.id)} · ${esc(c.title)}</div><div class="subtext">${esc(c.category)} · ${esc(c.owner)} · SLA ${new Date(c.sla).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}</div></div>${overdue?'<span class="badge red">OVERDUE SLA</span>':iconBadge(c.status)}</div><div class="notice" style="margin:10px 0">${c.updates.map(x=>`• ${esc(x)}`).join("<br>")}</div><div class="btn-row"><select class="filter-select" data-complaint-status="${c.id}">${statuses.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select><button class="small-btn" data-complaint-update="${c.id}">Tambah Pembaruan</button></div></div></article>`}).join("")}</div></div>`}
    function renderRooms(){return `${pageHeader("Ruangan dan Aset QR","Pemesanan bebas benturan, persetujuan, QR check-in simulasi, dan inventaris.")}<section class="panel" style="margin-bottom:12px"><div class="panel-head"><h3>Ajukan Pemesanan Ruangan</h3></div><div class="panel-body"><form id="bookingForm" class="grid three-col"><div class="field"><label>Ruangan</label><select name="roomId">${state.rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join("")}</select></div><div class="field"><label>Tanggal</label><input name="date" type="date" required value="${state.selectedDate}"></div><div class="field"><label>Tujuan kegiatan</label><input name="purpose" required></div><div class="field"><label>Mulai</label><input name="start" type="time" required value="13:00"></div><div class="field"><label>Selesai</label><input name="end" type="time" required value="14:00"></div><div class="field" style="display:flex;align-items:end"><button class="primary">Ajukan Booking</button></div></form></div></section><div class="grid room-grid">${state.rooms.map(r=>`<article class="room-card"><div class="split"><h3>${esc(r.name)}</h3><span class="badge green">AKTIF</span></div><p>${r.type} · Kapasitas ${r.capacity} orang</p><div class="btn-row" style="margin-top:10px"><button class="small-btn" data-room-token="${r.id}">Token QR Dinamis</button><button class="small-btn" data-room-book="${r.id}">Pilih Ruangan</button></div></article>`).join("")}</div><section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Pemesanan Ruangan</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Ruangan / Tujuan</th><th>Tanggal</th><th>Waktu</th><th>Pemohon</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${state.bookings.map(b=>{const room=state.rooms.find(r=>r.id===b.roomId);return `<tr><td><div class="person">${room?.name||b.roomId}</div><div class="subtext">${esc(b.purpose)}</div></td><td>${b.date}</td><td>${b.start}–${b.end}</td><td>${esc(b.by)}</td><td>${iconBadge(b.status)}</td><td><div class="btn-row">${b.status==="Menunggu"?`<button class="small-btn success" data-book-approve="${b.id}">Setujui</button>`:""}<button class="small-btn" data-book-checkin="${b.id}">Scan QR Check-In</button><button class="small-btn" data-book-checkout="${b.id}">Check-Out & Lapor Kondisi</button></div></td></tr>`}).join("")}</tbody></table></div></section><p class="muted" style="font-size:9px;margin-top:10px">Inventaris aset aktif: 24 item · 2 aset dalam pemeliharaan (simulasi).</p>`}
    function renderAssignments(){const history=(state.assignmentHistory||[]).slice().sort((a,b)=>`${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));return `${pageHeader("Tugas Tambahan & Program Kerja","Kepala Sekolah dapat meninjau laporan harian, progres proyek, kendala, dan evaluasi setiap pemegang tugas.")}<div class="notice">Laporan dan progres dicatat per tugas tambahan. Catatan terbaru terlihat pada dashboard Kepala Sekolah dan masuk ke audit log.</div><div class="grid session-grid">${state.assignments.filter(a=>a.status==="Aktif").map(a=>{const latest=(a.dailyUpdates||[]).slice().sort((x,y)=>`${y.date} ${y.time}`.localeCompare(`${x.date} ${x.time}`))[0];return `<article class="assignment-card"><div class="split"><h3>${esc(a.title)}</h3><span class="badge">${a.id}</span></div><p>Pemegang tugas: <b>${esc(a.owner)}</b></p><div class="grid three-col" style="gap:7px;margin-top:12px"><div><div class="subtext">PROGRES ADMINISTRATIF</div><b style="font-size:15px">${a.progress}%</b><div class="progress"><i style="width:${a.progress}%"></i></div><p>Kelengkapan dokumen</p></div><div><div class="subtext">INDIKATOR KEBERHASILAN (KPI)</div><p><b>${esc(a.kpi)}</b></p><p>Target unit kerja</p></div><div><div class="subtext">EVALUASI KUALITAS ATASAN</div><p>${esc(a.evaluation)}</p>${iconBadge("Menunggu verifikasi")}</div></div><section style="margin-top:12px;padding:10px;background:#f8fafc;border-radius:9px"><div class="split"><b style="font-size:10px">${esc(a.projectTitle)}</b><b style="font-size:11px">${a.projectProgress??a.progress}%</b></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,a.projectProgress??a.progress))}%"></i></div><div class="subtext">PROYEK / PROGRAM KERJA</div></section><div class="notice" style="margin-top:9px">${a.complaint?`Keluhan / kendala: ${esc(a.complaint)}`:"Keluhan / kendala: Tidak ada yang dilaporkan."}</div><div class="warning-desc">${latest?`Laporan terakhir ${esc(latest.date)} ${esc(latest.time)}: ${esc(latest.text)}`:"Belum ada laporan kegiatan."}</div><div class="btn-row" style="margin-top:11px"><button class="small-btn primary" data-daily-report="${a.id}">＋ Catat Pekerjaan Hari Ini</button><button class="small-btn" data-assignment-revision="${a.id}">Minta Revisi Laporan</button><button class="small-btn success" data-assignment-approve="${a.id}">Verifikasi & Setujui Selesai</button></div></article>`}).join("")}</div><section class="panel" style="margin-top:14px"><div class="panel-head"><h3>Riwayat Laporan Kegiatan Harian</h3><span class="badge">${history.length} LAPORAN</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tanggal / Waktu</th><th>Pemegang Tugas</th><th>Proyek</th><th>Kegiatan Hari Ini</th><th>Progres</th><th>Keluhan / Kendala</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.date)}<div class="subtext">${esc(h.time)}</div></td><td>${esc(h.owner)}</td><td>${esc(h.assignmentTitle)}</td><td>${esc(h.text)}</td><td>${h.progress}%</td><td>${h.complaint?esc(h.complaint):"Tidak ada"}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Belum ada laporan kegiatan.</td></tr>'}</tbody></table></div></section><section class="panel" style="margin-top:14px"><div class="panel-head"><h3>Program Kerja per Unit</h3></div><div class="panel-body">${state.workPlans.map(x=>`<div class="unit-bar"><div class="unit-row"><span>${x.unit}</span><b>${x.progress}%</b></div><div class="bar-bg"><div class="bar-fill" style="width:${x.progress}%"></div></div></div>`).join("")}</div></section>`}

    ];const [title,items,module]=all[index];const body=`<div class="split" style="margin-bottom:10px"><span class="badge">${items.length} BARIS DETAIL</span><span class="muted" style="font-size:9px">Sumber: ${["teachers","teacher_attendances","teacher_attendances","teacher_attendances","students","student_lesson_attendances","student_lesson_attendances","student_gate_attendances","lesson_journals","lesson_journals","complaints","additional_assignments"][index]}</span></div><div style="max-height:48vh;overflow:auto">${items.map(x=>`<div class="activity"><span class="activity-text">${esc(x)}</span></div>`).join("")||'<div class="empty">Tidak ada data sesuai indikator.</div>'}</div>`;openModal(`Drill-Down · ${title}`,body);const modal=document.querySelector(".modal-backdrop:last-child");modal.querySelector(".modal-body").insertAdjacentHTML("beforeend",`<div style="margin-top:12px"><button class="primary" data-drill-go="${module}">Buka Modul Lengkap →</button></div>`);modal.querySelector("[data-drill-go]").onclick=()=>{state.activeModule=module;save();modal.remove();render()}}
    function openRoomToken(roomId){const room=state.rooms.find(x=>x.id===roomId);if(!room)return;const token="SIGNED-QR-"+btoa(`${room.id}:${Date.now()}`).replace(/=+/g,"").slice(0,24);openModal(`Token QR Dinamis · ${esc(room.name)}`,`<div style="text-align:center;padding:10px"><div style="width:150px;height:150px;margin:0 auto 12px;background:repeating-conic-gradient(#172554 0% 25%,#fff 0% 50%) 50%/18px 18px;border:8px solid white;outline:1px solid #cbd5e1;border-radius:7px"></div><div class="room-token">${token}</div><p class="subtext">Token simulasi untuk ruang ${esc(room.name)}. Token baru dibuat setiap kali dialog dibuka.</p></div>`)}
    function openCsvPreview(file){const target=document.getElementById("importPreview");if(!file){toast("Pilih file CSV untuk dipratinjau.","error");return}const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).split(/\r?\n/).filter(Boolean);const rows=lines.slice(0,6).map(x=>x.split(",").map(v=>v.replace(/^"|"$/g,"")));const header=rows[0]||[];const nipIndex=header.findIndex(h=>/nip/i.test(h));const nips=nipIndex<0?[]:lines.slice(1).map(line=>line.split(",")[nipIndex]?.replace(/^"|"$/g,"")).filter(Boolean);const duplicateNips=nips.filter((v,i)=>nips.indexOf(v)!==i);const existing=new Set(state.teachers.map(t=>t.id));const dupeCount=duplicateNips.length+nips.filter(v=>existing.has(v)).length;target.innerHTML=`<p class="subtext">Baris terdeteksi: ${Math.max(lines.length-1,0)} · Duplikasi NIP: <b style="color:${dupeCount?"#be123c":"#047857"}">${dupeCount}</b></p><div class="table-wrap"><table class="data-table"><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;toast("Pratinjau CSV berhasil dibuat.")};reader.onerror=()=>toast("File CSV tidak dapat dibaca.","error");reader.readAsText(file)}
    function renderSqlTab(tab){const target=document.getElementById("sqlContent");if(!target)return;document.querySelectorAll("[data-sql-tab]").forEach(x=>x.classList.toggle("active",x.dataset.sqlTab===tab));if(tab==="schema"){target.textContent=sqlTables.map(t=>`create table if not exists public.${t} (\n  id uuid primary key default gen_random_uuid(),\n  school_id uuid references public.schools(id),\n  status text,\n  is_active boolean not null default true,\n  archived_at timestamptz,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);`).join("\n\n")}else if(tab==="rls"){target.textContent=`-- Contoh fondasi RLS; lengkapi fungsi pemetaan role dan relasi sekolah sebelum produksi.\nalter table public.incidents enable row level security;\ncreate policy incidents_school_access on public.incidents\n  for select to authenticated\n  using (school_id = (auth.jwt() ->> 'school_id')::uuid\n    and (is_sensitive = false or auth.jwt() ->> 'role' in ('kepala_sekolah','wakil_kepala_sekolah','guru_piket')));\n\n-- Terapkan RLS dan kebijakan terpisah pada setiap tabel sesuai role dan sekolah.\n-- Jangan memakai service_role key di browser.`}else{target.textContent=`MODE DEMO LOKAL\n✓ ${state.settings.school}\n✓ Kepala Sekolah: ${state.settings.principal}\n    ✓ ${state.teachers.length} guru, ${state.staff.length} tenaga kependidikan\n✓ ${state.students.length} siswa, ${classNames.length} rombel, ${state.subjects.length} mapel\n✓ Verifikasi selisih kehadiran tersedia\n✓ Persetujuan, jurnal, tiket, booking, audit trail berfungsi\n○ Koneksi Supabase dan Realtime belum dikonfigurasi\n○ Migrasi RLS produksi wajib direview dan dijalankan di Supabase`}}
    root.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.go){state.activeModule=b.dataset.go;save();render();return}
      if(b.dataset.metric!==undefined){openMetric(Number(b.dataset.metric));return}
      if(b.dataset.export){csvExports[b.dataset.export]?.();return}
      if(b.dataset.action==="start-attendance-session"){openStartAttendanceSession();return}

      if(b.dataset.dailyReport){openDailyWorkReport(b.dataset.dailyReport);return}
      if(b.dataset.studentClass){state.studentClass=b.dataset.studentClass;save();render();return}
      if(b.dataset.action==="toggle-verification"){state.studentVerificationOnly=!state.studentVerificationOnly;render();return}
      if(b.dataset.action==="new-journal"){openJournal();return}
      if(b.dataset.action==="approve-correction"||b.dataset.action==="reject-correction"){if(!["kepala_sekolah","super_admin","admin_operator","wakil_kepala_sekolah"].includes(state.currentRole)){toast("Role Anda tidak memiliki izin menyetujui koreksi presensi.","error");return}mutate(b.dataset.action==="approve-correction"?"APPROVE_ATTENDANCE_CORRECTION":"REJECT_ATTENDANCE_CORRECTION","Permohonan koreksi presensi",b.dataset.action==="approve-correction"?"Koreksi presensi disetujui.":"Koreksi presensi ditolak.");return}
      if(b.dataset.verifyStudent){openStudentVerification(b.dataset.verifyStudent);return}
      if(b.dataset.editJournal){openJournal(b.dataset.editJournal);return}
      if(b.dataset.journalDraft||b.dataset.journalSubmit)return;
      if(b.dataset.roomToken){openRoomToken(b.dataset.roomToken);return}
      if(b.dataset.roomBook){const select=document.querySelector('#bookingForm [name="roomId"]');if(select)select.value=b.dataset.roomBook;document.querySelector("#bookingForm")?.scrollIntoView({behavior:"smooth",block:"center"});return}
      if(b.dataset.bookApprove){const booking=state.bookings.find(x=>x.id===b.dataset.bookApprove);if(booking){booking.status="Disetujui";mutate("APPROVE_ROOM_BOOKING",booking.id,"Pemesanan ruangan disetujui.")}return}
      if(b.dataset.bookCheckin){const booking=state.bookings.find(x=>x.id===b.dataset.bookCheckin);if(booking){if(booking.status!=="Disetujui"){toast("Pemesanan harus disetujui sebelum check-in.","error");return}booking.checkIn=true;booking.status="Check-In";mutate("QR_CHECKIN_ROOM",booking.id,"Check-in QR simulasi berhasil dicatat.")}return}
      if(b.dataset.bookCheckout){const booking=state.bookings.find(x=>x.id===b.dataset.bookCheckout);if(booking){if(!booking.checkIn){toast("Lakukan Scan QR Check-In sebelum check-out.","error");return}const body=`<div class="field"><label>Kondisi / catatan checkout</label><textarea name="condition" rows="3" required placeholder="Contoh: ruangan rapi, perangkat lengkap"></textarea></div>`;openModal("Check-Out & Lapor Kondisi",body,box=>{const note=box.querySelector('[name="condition"]').value.trim();if(!note){toast("Isi kondisi ruangan sebelum check-out.","error");return false}booking.status="Selesai";booking.condition=note;mutate("QR_CHECKOUT_ROOM",booking.id,"Check-out dan kondisi ruangan tersimpan.")})}return}
      if(b.dataset.complaintUpdate){const c=state.complaints.find(x=>x.id===b.dataset.complaintUpdate);if(!c)return;const select=document.querySelector(`[data-complaint-status="${c.id}"]`);c.status=select.value;c.updates.push(`${new Date().toLocaleString("id-ID")} · Status diubah menjadi ${c.status} oleh ${roleNames[state.currentRole]}`);mutate("UPDATE_COMPLAINT_STATUS",`${c.id} · ${c.status}`,"Status tiket diperbarui.");return}
      if(b.dataset.assignmentRevision||b.dataset.assignmentApprove){const a=state.assignments.find(x=>x.id===(b.dataset.assignmentRevision||b.dataset.assignmentApprove));if(!a)return;if(b.dataset.assignmentRevision){a.evaluation="Revisi diminta oleh "+roleNames[state.currentRole];mutate("REQUEST_ASSIGNMENT_REVISION",a.id,"Permintaan revisi dicatat.")}else{if(!["kepala_sekolah","super_admin","wakil_kepala_sekolah"].includes(state.currentRole)){toast("Hanya Kepala Sekolah, Waka, atau Super Admin yang dapat memverifikasi tugas.","error");return}a.status="Selesai";a.evaluation="Diverifikasi dan disetujui oleh "+roleNames[state.currentRole];mutate("APPROVE_ADDITIONAL_ASSIGNMENT",a.id,"Tugas tambahan disetujui selesai.")}return}
      if(b.dataset.role){state.currentRole=b.dataset.role;state.activeModule="dashboard";mutate("SWITCH_RBAC_ROLE",roleNames[b.dataset.role],"Simulasi role diperbarui.");return}
      if(b.dataset.notification!==undefined){const n=state.notifications[Number(b.dataset.notification)];if(n){n.unread=false;state.activeModule=n.module;mutate("OPEN_RELATED_NOTIFICATION",n.title,"Notifikasi dibuka.");}return}
      if(b.dataset.action==="read-all"){state.notifications.forEach(n=>n.unread=false);mutate("MARK_NOTIFICATIONS_READ","Semua notifikasi","Semua notifikasi ditandai telah dibaca.");return}
      if(b.dataset.action==="preview-import"){document.getElementById("csvFile").click();return}
      if(b.dataset.report!==undefined){const ix=Number(b.dataset.report);const all=[()=>csvExports.teachers(),()=>csvExports.students(),()=>downloadCsv("selisih-gerbang-kelas.csv",[["ID","Nama","Kelas","Tap Gerbang","Status Kelas"],...state.students.filter(s=>s.lesson==="Perlu Verifikasi").map(s=>[s.id,s.name,s.className,s.gateTime,s.lesson])]),()=>downloadCsv("jurnal-kbm.csv",[["Kelas","Mapel","Guru","Status Jurnal","Hadir","Revisi"],...state.sessions.map(s=>[s.className,s.subject,s.teacher,s.journal,s.present,s.revision])]),()=>downloadCsv("keterlambatan-guru.csv",[["ID","Nama","Jam Masuk"],...state.teachers.filter(t=>t.status==="Terlambat").map(t=>[t.id,t.name,t.checkIn])]),()=>downloadCsv("keterlambatan-siswa.csv",[["ID","Nama","Kelas","Jam Tap"],...state.students.filter(s=>s.late).map(s=>[s.id,s.name,s.className,s.gateTime])]),()=>downloadCsv("pengaduan-sla.csv",[["ID","Judul","Status","SLA"],...state.complaints.map(c=>[c.id,c.title,c.status,c.sla])]),()=>downloadCsv("buku-piket.csv",[["ID","Judul","Rincian","Sensitif"],...state.duties.map(d=>[d.id,d.title,d.sensitive?"Rincian privat":"Tercatat",d.sensitive])]),()=>downloadCsv("pemesanan-ruangan.csv",[["ID","Ruangan","Tanggal","Mulai","Selesai","Status"],...state.bookings.map(b=>[b.id,state.rooms.find(r=>r.id===b.roomId)?.name,b.date,b.start,b.end,b.status])]),()=>downloadCsv("tugas-tambahan.csv",[["ID","Tugas","Pemegang","Progres","KPI","Evaluasi"],...state.assignments.map(a=>[a.id,a.title,a.owner,a.progress,a.kpi,a.evaluation])]),()=>downloadCsv("program-kerja.csv",[["Unit","Progres"],...state.workPlans.map(x=>[x.unit,x.progress])]),()=>downloadCsv("audit-log.csv",[["Waktu","Aksi","Objek","Pelaku"],...state.audit.map(a=>[a.time,a.action,a.object,a.actor])])];all[ix]?.();return}
      if(b.dataset.sqlTab){renderSqlTab(b.dataset.sqlTab);return}
      if(b.dataset.action==="copy-sql"){navigator.clipboard?.writeText(document.getElementById("sqlContent").textContent).then(()=>toast("SQL berhasil disalin.","success")).catch(()=>toast("Clipboard tidak tersedia pada konteks ini.","error"));return}
      if(b.dataset.trend){document.querySelectorAll("[data-trend]").forEach(x=>x.classList.toggle("active",x===b));toast(b.dataset.trend==="7"?"Menampilkan tren 7 hari terakhir.":"Menampilkan tren 30 hari dalam agregat mingguan.");return}
      if(b.dataset.teacherIn||b.dataset.teacherOut){const t=state.teachers.find(x=>x.id===(b.dataset.teacherIn||b.dataset.teacherOut));if(!t)return;const time=nowTime();if(b.dataset.teacherIn){if(t.checkIn){toast("Presensi masuk guru sudah tercatat.","error");return}t.checkIn=time;t.status=time>"07:00"?"Terlambat":"Tepat Waktu";t.verification="Terverifikasi";mutate("TEACHER_CHECK_IN",t.id,`Presensi masuk ${t.name} tercatat pukul ${time}.`)}else{if(!t.checkIn){toast("Catat presensi masuk terlebih dahulu.","error");return}if(t.checkedOut){toast("Presensi pulang sudah tercatat.","error");return}t.checkedOut=time;mutate("TEACHER_CHECK_OUT",t.id,`Presensi pulang ${t.name} tercatat pukul ${time}.`)}return}
    });
    root.addEventListener("change",e=>{
      if(e.target.id==="roleSwitcher"){state.currentRole=e.target.value;state.activeModule="dashboard";log("SWITCH_RBAC_ROLE",roleNames[state.currentRole]);save();render();return}
      if(e.target.id==="dateFilter"){state.selectedDate=e.target.value;save();return}
      if(e.target.id==="classFilter"){state.classFilter=e.target.value;save();render();return}
      if(e.target.id==="unitFilter"){state.unitFilter=e.target.value;save();render();return}
      if(e.target.id==="teacherStatus"){const status=e.target.value;document.querySelectorAll("#teacherStatus").forEach(()=>{});root.querySelectorAll("tbody tr[data-status]").forEach(row=>row.style.display=status==="Semua"||row.dataset.status===status?"":"none");return}
      if(e.target.dataset.sessionAttendance){const session=state.attendanceSessions.find(s=>s.id===e.target.dataset.sessionAttendance),studentId=e.target.dataset.studentAttendance,status=e.target.value;if(!session||session.status!=="Berlangsung"||!session.roster.includes(studentId)){toast("Sesi absensi tidak aktif atau siswa tidak termasuk rombel ini.","error");render();return}if(!["Hadir","Sakit","Izin","Alpa"].includes(status)){toast("Pilih Hadir, Sakit, Izin, atau Alpa.","error");return}session.attendance[studentId]=status;session.attendanceTimes=session.attendanceTimes||{};session.attendanceTimes[studentId]=nowTime();mutate("RECORD_LESSON_STUDENT_ATTENDANCE",`${session.className} · ${session.subject} · ${studentId} · ${status}`,`Status ${status} tercatat.`);return}
      if(e.target.id==="csvFile"){openCsvPreview(e.target.files[0]);return}
    });
    root.addEventListener("input",e=>{if(e.target.id==="globalSearch"){state.search=e.target.value;save();if(["teacher","student"].includes(state.activeModule)){const pos=e.target.selectionStart;render();const input=document.getElementById("globalSearch");input?.focus();input?.setSelectionRange(pos,pos)} }});
    root.addEventListener("submit",e=>{
      e.preventDefault();const form=e.target,data=new FormData(form);
      if(form.id==="dutyForm"){const title=String(data.get("title")).trim(),detail=String(data.get("detail")).trim();if(!title||!detail)return;state.duties.unshift({id:"INC-"+String(Date.now()).slice(-6),title,detail,sensitive:data.has("sensitive"),time:nowTime(),by:roleNames[state.currentRole]});mutate("CREATE_DUTY_LOG",title,"Catatan piket tersimpan.");return}
      if(form.id==="complaintForm"){const title=String(data.get("title")).trim();if(!title)return;const number=String(state.complaints.length+1).padStart(3,"0");const ticket={id:`TKT-${new Date().toISOString().slice(0,7).replace("-","")}-${number}`,title,category:data.get("category"),status:"Baru",sla:new Date(Date.now()+24*60*60*1000).toISOString(),owner:data.get("owner"),updates:[`Tiket dibuat oleh ${roleNames[state.currentRole]}`]};state.complaints.unshift(ticket);mutate("CREATE_COMPLAINT",ticket.id,"Pengaduan berhasil dibuat.");return}
      if(form.id==="bookingForm"){const booking={id:"BK-"+String(Date.now()).slice(-6),roomId:data.get("roomId"),date:data.get("date"),start:data.get("start"),end:data.get("end"),purpose:String(data.get("purpose")).trim(),status:"Menunggu",by:roleNames[state.currentRole],checkIn:false};if(!booking.start||!booking.end||booking.start>=booking.end){toast("Rentang waktu tidak valid. Jam selesai harus setelah jam mulai.","error");return}const conflict=state.bookings.find(b=>b.roomId===booking.roomId&&b.date===booking.date&&!["Ditolak","Selesai"].includes(b.status)&&booking.start<b.end&&booking.end>b.start);if(conflict){toast(`Konflik jadwal: ruangan sudah dipesan ${conflict.start}–${conflict.end}.`,"error");return}state.bookings.unshift(booking);mutate("REQUEST_ROOM_BOOKING",booking.id,"Pemesanan ruangan diajukan.");return}
      if(form.id==="settingsForm"){const retention=Number(data.get("retention")),school=String(data.get("school")).trim(),principal=String(data.get("principal")).trim();if(retention<30||retention>3650){toast("Retensi harus antara 30 hingga 3650 hari.","error");return}if(!school||!principal){toast("Nama sekolah dan Kepala Sekolah wajib diisi.","error");return}state.settings={school,principal,entryTime:data.get("entryTime"),retention};mutate("UPDATE_SCHOOL_SETTINGS","Konfigurasi sekolah","Pengaturan sekolah disimpan.");return}
    });
    root.addEventListener("click",e=>{
      const button=e.target.closest(".modal [data-journal-draft],.modal [data-journal-submit]");if(button){const id=button.dataset.journalDraft||button.dataset.journalSubmit;const session=state.sessions.find(x=>x.id===id);if(session)saveJournal(button.closest(".modal-backdrop"),session,button.dataset.journalDraft?"Draf":"Sudah Dikirim")}

    save();render();
